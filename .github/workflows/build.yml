name: Build private trip site

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Test publication checks
        run: python -m unittest discover -s tests -v
      - name: Build static site
        run: python scripts/build_pages.py
      - name: Validate pages, links and JavaScript
        run: python scripts/validate_site.py dist --check-js
      - name: Save private website artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: paris-trip-site
          path: dist
          retention-days: 30
          if-no-files-found: error
      - name: Save private single-file edition
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: paris-trip-offline
          path: dist/paris-companion-plan.html
          retention-days: 30
          if-no-files-found: error
